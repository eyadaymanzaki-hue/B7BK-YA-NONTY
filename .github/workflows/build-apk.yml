name: Build B7BK YA NONTY APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unzip project
        shell: bash
        run: |
          echo "Files in repository:"
          ls -la

          ZIP_FILE=$(find . -maxdepth 1 -type f \( -iname "*.zip" -o -iname "Nono" -o -iname "Nono.zip" \) | head -n 1)

          echo "Found: $ZIP_FILE"

          test -n "$ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find "$PWD/extracted" -name settings.gradle -type f -print -quit | xargs -r dirname)

          echo "Project: $PROJECT_DIR"

          test -n "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: B7BK-YA-NONTY-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
